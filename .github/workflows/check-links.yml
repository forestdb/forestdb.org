name: Check links

on:
  schedule:
    - cron: '17 6 1 * *'  # monthly, 1st at 06:17 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install lychee
        run: |
          curl -sL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

      - name: Check links on the live site
        id: lychee
        run: |
          curl -sf https://forestdb.org/models.json | jq -r '.models[].url' > urls.txt
          echo "https://forestdb.org/" >> urls.txt
          echo "Checking $(wc -l < urls.txt) pages"
          set +e
          ./lychee --no-progress \
            --max-concurrency 8 \
            --timeout 20 \
            --max-retries 2 \
            --accept '100..=103,200..=299,403,429' \
            --exclude '^https://github\.com/forestdb/forestdb\.org/(edit|new|commits)/' \
            --exclude '^https://web\.archive\.org/' \
            --format markdown \
            --output lychee-report.md \
            $(cat urls.txt)
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          true

      - name: Report broken links in an issue (create or update)
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link checker report"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file lychee-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file lychee-report.md
          fi
