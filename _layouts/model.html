---
layout: default
---

  <div class="btn-toolbar pull-right top-toolbar">
    <a id="github-edit-link" href="#" class="btn btn-success">Edit page</a>
  </div>

<div class="page-header">
  <h1>{{ page.title }}</h1>
</div>

{% if page.model-status == "static" %}
  {% if page.model-status-verbose %}
    <div class="alert alert-info"><strong>Note:</strong> The code on this page is shown as a static listing, not a runnable model. ({{ page.model-status-verbose }})</div>
  {% endif %}
{% endif %}

{{ content }}

<script type="text/javascript">
  $("#github-edit-link").attr("href", github_edit_url("{{ page.url }}"));
  load_page_contributors("{{ page.url }}");
</script>
